<!-- BOTON RESPONSIVO-->

<!--AGREGAR PRODUCTOS-->
<main class="pt-20">

<div class="contenedor">
    <div class="añadir">
        <h2>Añadir</h2>
        <form>
            <label>Nombre del Producto</label>
            <input type="text" id="productoAñadir" name="nombredelProducto">
            <label>Valor del Producto</label>
            <input type="number" id="valorAñadir">
            <label>Descripción del Producto</label>
            <input type="text" id="descripcionAñadir">
            <label>Existencia</label>
            <input type="number" id="existenciaAñadir">
            <label >Url Imagen</label>
            <input type="text" id="ImagenAñadir">
            <label>Categoria del Producto</label>
            <select id="categoriaAñadir">
              <option>Selecciona categoría</option>
              <option value="onepiece">One Piece</option>
              <option value="dragonball">Dragon Ball</option>
              <option value="bleach">Bleach</option>
              
            </select>
            <input class="button" type="button" id="botonAñadir" value="Añadir">
            
          </form>
    </div>
        <!--EDITAR-->
        <div class="editar">
            <h2 >Editar</h2>
            <form>
                <label>Nombre del Producto</label>
                <select id="productoEditar">
                    <option value="">Selecciones el Producto</option>
                </select>
                <label>Atributo</label>
                <select id="atributoEditar">
                    <option value=""></option>
                </select>
                <label>Nuevo Valor</label>
                <input type="text" id="nuevoAtributo">
                <input class="button" type="button" id="botonEditar" value="Editar">
            </form>
        </div>
        <div class="eliminar">
            <h2>Eliminar</h2>
            <form >
                <label>Nombre del Producto</label>
                <select id="productoEliminar">
                    <option value="">Selecione el Producto</option>
                </select>
                <input class="button" type="button" id="botonEliminar" value="Eliminar">
            </form>
        </div>
        </div>
        <!--MOSTRAR MENSAJE-->
        <div class="contenedorMensaje">
            <div id="mensaje"></div>
        </div>
        <!--PRODUCTOS-->
        <div class="contenedorProductos">
            <h2 class="text-3xl font-bold text-center mb-8">Figuras de One Piece</h2>
          <div class="mostrarProductos" id="tiendaOnepiece"></div>
        </div>

        <div class="contenedorProductos">
          <h2 class="text-3xl font-bold text-center mb-8">Figuras de Dragon Ball</h2>
        <div class="mostrarProductos" id="tiendaDragonball"></div>
        </div>

        <div class="contenedorProductos">
          <h2 class="text-3xl font-bold text-center mb-8">Figuras de Bleach</h2>
        <div class="mostrarProductos" id="tiendaBleach"></div>
        </div>
        </main>

    <script type="module" src="/admin/admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
