<main>
    <div class="w-full bg-center bg-cover h-[38rem]" style=" background-image: url('https://4kwallpapers.com/images/walls/thumbs_3t/16712.jpg');">
        <div class="flex items-center justify-center w-full h-full bg-gray-900/40">
            <div class="text-center">
                <h1 class="text-3xl font-semibold text-white lg:text-4xl">Registrate <span class="text-blue-400">Ahora</span>  compra Ya</h1>
                <button  id="btn_inicio" class="w-full px-5 py-2 mt-4 text-sm font-medium text-white capitalize transition-colors duration-300 transform bg-blue-600 rounded-md lg:w-auto hover:bg-blue-500 focus:outline-none focus:bg-blue-500">Iniciar Sesión</button>
                <button  id="btn_registro" class="w-full px-5 py-2 mt-4 text-sm font-medium text-white capitalize transition-colors duration-300 transform bg-gray-600 rounded-md lg:w-auto hover:bg-gray-500 focus:outline-none focus:bg-gray-500">Registrate</button>
            </div>
        </div>
    </div>
<main>

        <div class="sesion-wrapper">
          <div class="sesion-slider" id="sesionSlider">
        <div class="contenedor_login">
          <h2>Inicia Sesión</h2>
          <p class="login_subtitulo">Accede a tu cuenta</p>
          <form action="#" id="login">
            <div><label>Email</label>
        <input type="email" id="loginEmail" required>
        <small class="error"></small>
      </div>

      <div>
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required>
        <small class="error"></small>
      </div>
      <button class="botonlogin" id="botonlogin" type="submit">Entrar</button>
    </div>
  </form>
        </div>
        <div class="contenedor_registro">
        <h2>Registro</h2>
        <form action="#" id="Registro">
            <div>
                <label for="username">nombre</label>
                <input type="text" name="username" id="username">
                <small class="error" id="err-username"></small>
            </div>
            
            <div>
                <label for="email">email</label>
                <input type="text" name="email" id="email">
                <small class="error" id="err-email"></small>
            </div>
            <div>
                <label for="password">contraseña</label>
                <input type="password" name="password" id="password">
                <small class="error" id="err-password"></small>
            </div>
              <div>
                <label for="confirmpassword">confirmar contraseña</label>
                <input type="password" name="confirmpassword" id="confirmpassword">
                <small class="error" id="err-confirmpassword"></small>
            </div>

            <button class="botonRegistro" id="botonRegistro" type="submit">Registrar</button>
            <button class="botonLimpiar" id="botonLimpiar" type="reset">Limpiar</button>

          </form>
      </div>
      </div>
      </div>

        <script type="module" src="../JS/sesion.js"></script>
        </body>
